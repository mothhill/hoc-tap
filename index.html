<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A120E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>(function () { var t = 'dark'; try { t = localStorage.getItem('theme') || 'dark'; } catch (e) { } document.documentElement.setAttribute('data-theme', t); })();</script>
<title>Học tập VLSN</title>
<style>
:root{
  --bg:#0A120E; --card:#1B2B22; --card2:#22352A; --line:#26342C; --ink:#EEF4EC; --muted:#8CA095;
  --primary:#B8F061; --primary-ink:#10230F; --primary-soft:rgba(184,240,97,.14);
  --mint:#4FC98A; --mint-soft:rgba(79,201,138,.14);
  --peach:#FF9F72; --peach-soft:rgba(255,159,114,.14);
  --gold:#F5C444; --gold-soft:rgba(245,196,68,.14);
  --pink:#FF6F91; --pink-soft:rgba(255,111,145,.14);
  --sky:#5FB8F0; --sky-soft:rgba(95,184,240,.14);
  --ok:#4FC98A; --warn:#F5C444; --bad:#FF6F91; --gray:#7D8F86;
  --r:18px; --shadow:0 6px 24px rgba(0,0,0,.28); --edge:rgba(184,240,97,.13);
  --glow:rgba(184,240,97,.07);
}
:root[data-theme=light]{
  --bg:#EDF4EB; --card:#FFFFFF; --card2:#F1F6EF; --line:#DCE8DC; --ink:#12261A; --muted:#5F766A;
  --primary:#2A8A55; --primary-ink:#FFFFFF; --primary-soft:#E2F3E7;
  --mint:#2FB67A; --mint-soft:#E1F5EA;
  --peach:#F07F4D; --peach-soft:#FFF0E8;
  --gold:#E0A21C; --gold-soft:#FFF6DD;
  --pink:#E5527A; --pink-soft:#FDE8EE;
  --sky:#2F8FD0; --sky-soft:#E3F1FB;
  --ok:#2FB67A; --warn:#E0A21C; --bad:#E5527A; --gray:#A3B2AA;
  --shadow:0 4px 16px rgba(20,60,35,.08); --edge:#DCE8DC; --glow:rgba(42,138,85,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-moz-text-size-adjust:none;text-size-adjust:100%}
html{background:var(--bg)}
body{background:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%),var(--bg);min-height:100vh}
button,input{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:6px 16px 104px}

.brandbar{max-width:520px;margin:0 auto;padding:14px 16px 0}
.brand{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;border:1px solid #2F5A40;background:linear-gradient(120deg,#2B6341 0%,#0B2F20 55%,#285233 100%);box-shadow:0 10px 40px rgba(0,0,0,.35);color:#F4F8F1}
.brand img{width:58px;height:58px;border-radius:16px;border:3px solid #3C7A52;flex:none;display:block;background:#fff}
.brand .bt{min-width:0;flex:1}
.brand .bp{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#C6F58A;border:1px solid #4E9A63;border-radius:99px;padding:3px 9px;background:rgba(10,40,26,.45);white-space:nowrap}
.brand .b1{font-size:21px;line-height:1.1;font-weight:800;margin-top:6px;letter-spacing:-.5px;white-space:nowrap}
.brand .b2{color:#B8F061}
.themebtn{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid #3C7A52;background:rgba(10,40,26,.45);font-size:17px;cursor:pointer;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:10px;margin:14px 2px 2px}
.who .av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--mint));color:#10230F;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.who .nm{flex:1;min-width:0}
.who .nm small{display:block;color:var(--muted);font-size:12px}
.who .nm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:13px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(100deg,var(--mint),var(--primary));color:var(--primary-ink);font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(79,201,138,.22)}
:root[data-theme=light] .btn:not(.ghost){background:var(--primary);color:#fff}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--ink);font-weight:600;box-shadow:none}
.btn:disabled{opacity:.5}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);outline:none;font-size:17px}
.inp:focus{border-color:var(--primary)}
.seg{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--edge);margin:12px 0}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.chips button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--primary));border-radius:99px}
.bar.lo i{background:linear-gradient(90deg,var(--pink),var(--peach))}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:38px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#10230F;line-height:1.1}
.dot small{font-size:9.5px;font-weight:600;opacity:.75}
.d-x{background:var(--mint)}.d-xm{background:var(--gold)}.d-v{background:var(--pink)}.d-p{background:var(--gray)}.d-o{background:var(--card2);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list>div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0;padding-top:2px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.warn{background:var(--gold-soft);border:1px solid rgba(245,196,68,.45);border-radius:14px;padding:10px 12px;margin:12px 0;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(14,24,19,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid #2A3A31;padding:4px 10px calc(6px + env(safe-area-inset-bottom))}
:root[data-theme=light] .nav{background:rgba(255,255,255,.96);border-top-color:var(--line)}
.nav div{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;border-radius:12px}
.nav button b{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.55}
.nav button.on{color:var(--primary)}
.nav button.on b{filter:none;opacity:1}
.nav button.on::after{content:"";width:18px;height:3px;border-radius:99px;background:var(--primary);margin-top:1px}

.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .pct{font-size:26px;font-weight:800;line-height:1}
.ring .sub{font-size:11px;color:var(--muted);margin-top:3px}
.kchips{display:grid;gap:8px;flex:1;min-width:0}
.kchip{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:8px 10px}
.kchip .e{font-size:19px;flex:none}
.kchip b{font-size:16px;display:block;line-height:1.15}
.kchip small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expbig{font-size:30px;font-weight:800;color:var(--primary);line-height:1}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:12px 0 4px}
.stack i{display:block;height:100%}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding:20px 4px 0;border-bottom:1px solid var(--line)}
.bars .m{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;position:relative}
.bars .m i{width:42%;max-width:18px;border-radius:7px 7px 3px 3px;min-height:3px;position:relative}
.bars .m i b{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap}
.bars .k15{background:linear-gradient(180deg,var(--primary),var(--mint))}
.bars .k50{background:linear-gradient(180deg,var(--gold),var(--peach))}
.barlb{display:flex;gap:10px;padding:4px 4px 0}
.barlb span{flex:1;text-align:center;font-size:11px;color:var(--muted)}

.q-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer}
.q-opt.on{border-color:var(--primary);background:var(--primary-soft)}
.q-opt b{margin-right:6px}
.ds{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ds .tf{display:flex;gap:6px;flex:none}
.ds .tf button{width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:800;cursor:pointer}
.ds .tf button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.qimg{max-width:100%;max-height:240px;object-fit:contain;border-radius:10px;background:#fff;margin:8px auto;display:block}
.qde table{border-collapse:collapse;margin:8px 0;font-size:14px}
.qde td{border:1px solid var(--line);padding:4px 8px}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.qnav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-weight:700;cursor:pointer}
.qnav button.done{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.qnav button.cur{background:var(--primary);color:var(--primary-ink)}
.res-ok{color:var(--ok);font-weight:700}.res-bad{color:var(--bad);font-weight:700}
.rank{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px}
.rank.me{background:var(--primary-soft);outline:1px solid var(--primary)}
.rank .n{width:28px;text-align:center;font-weight:800}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:14px;background:var(--card2);font-size:12px}
.badge .ic{font-size:28px;display:block;margin-bottom:4px}
.badge.off{opacity:.38;filter:grayscale(1)}
.lvl{display:flex;align-items:center;gap:14px}
.lvl .ring{width:84px;height:84px}
.lvl .ring svg{transform:none}
.over{position:fixed;inset:0;z-index:20;background:rgba(6,18,12,.92);display:grid;place-items:center;padding:24px;text-align:center}
.over .big{font-size:84px;line-height:1}
.over h2{font-size:28px;margin:12px 0 6px;color:#B8F061}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:90%}
.spin{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
svg text{fill:var(--muted);font-size:10px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 0}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 4px}
.sec h3{font-size:16px;font-weight:700;margin:0}
.sec span{font-size:13px;color:var(--muted)}
.dn{text-align:center;padding:22px 18px;margin-top:18px}
.dn h2{margin:8px 0 4px;font-size:24px}
.dn .inp{text-align:center}
.dnhero{display:flex;justify-content:center;gap:10px;font-size:30px}
.dnhero span{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--primary-soft)}
.dnhero span:nth-child(2){background:var(--gold-soft);transform:translateY(-6px)}
.dnhero span:nth-child(3){background:var(--sky-soft)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.grid3>div{background:var(--card);border:1px solid var(--edge);border-radius:16px;box-shadow:var(--shadow);padding:12px 8px;text-align:center;font-size:22px}
.grid3 b{display:block;font-size:18px;font-weight:800;margin-top:2px}
.grid3.nho b{font-size:14px}
.grid3 span{display:block;font-size:11.5px;color:var(--muted)}
.chcard{display:flex;align-items:center;gap:12px;cursor:pointer;margin:10px 0;padding:14px}
.chcard:active{transform:scale(.99)}
.chic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.go{flex:none;padding:7px 14px;border-radius:99px;font-weight:800;font-size:13px;background:linear-gradient(100deg,var(--mint),var(--primary));color:#10230F}
:root[data-theme=light] .go{background:var(--primary);color:#fff}
.score{flex:none;min-width:56px;text-align:center;padding:6px 8px;border-radius:12px;font-weight:800;font-size:14px}
.q-opt{display:flex;align-items:flex-start;gap:10px}
.q-opt .qk{flex:none;width:28px;height:28px;margin:0;border-radius:9px;display:grid;place-items:center;background:var(--card2);font-size:14px}
.q-opt.on .qk{background:var(--primary);color:var(--primary-ink)}
.kqhero{display:flex;align-items:center;gap:16px;margin-top:14px}
.kqhero .pct{font-size:22px}
.kqc{border-left:4px solid var(--pink)}
.kqc.ok{border-left-color:var(--mint)}
.seg.small button{font-size:12.5px;padding:7px 6px}
.seg.small button.on{background:var(--primary-soft);color:var(--primary)}
.podium{display:flex;align-items:flex-end;gap:8px;padding:16px 10px 0;overflow:hidden}
.pd{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;margin-bottom:4px}
.pd.me .pav{outline:3px solid var(--primary)}
.pn{font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcol{width:100%;margin-top:8px;border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:8px;font-size:26px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.nv:first-child{border-top:0;padding-top:0}
.nv:last-child{padding-bottom:0}
.nv .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.nv.xong .ck{background:var(--mint);border-color:var(--mint);color:#10230F}
.nv.xong .sp{color:var(--muted);text-decoration:line-through}
.badge b{display:block;margin-top:2px}
.lcvong{width:150px;height:150px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(184,240,97,.35),rgba(79,201,138,.08) 60%,transparent 70%);animation:lc 1.6s ease-in-out infinite alternate}
.lcvong span{font-size:84px}
@keyframes lc{from{transform:scale(.94)}to{transform:scale(1.06)}}
.hide{display:none!important}
@media (min-width:900px){
  body{display:flex;flex-direction:column}
  .brandbar{order:0;max-width:1100px;width:100%;padding:20px 24px 0}
  .brand{gap:16px;padding:16px 20px;border-radius:26px}
  .brand img{width:76px;height:76px;border-radius:20px}
  .brand .b1{font-size:30px;margin-top:8px}
  .brand .bp{font-size:11px;padding:4px 12px;letter-spacing:1.4px}
  .themebtn{width:44px;height:44px;font-size:20px}
  .nav{order:1;position:sticky;top:0;bottom:auto;left:auto;right:auto;margin:14px auto 0;width:calc(100% - 48px);max-width:1052px;border:1px solid var(--edge);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
  :root[data-theme=light] .nav{border:1px solid var(--line)}
  .nav div{max-width:none;gap:6px}
  .nav button{flex-direction:row;justify-content:center;gap:8px;font-size:15px;padding:10px;border-radius:12px}
  .nav button b{font-size:20px}
  .nav button.on{background:var(--primary-soft)}
  .nav button.on::after{display:none}
  .wrap{max-width:1100px;width:100%;padding-left:24px;padding-right:24px}
  .whow{order:2}
  #app{order:3;padding-bottom:48px}
  #app[data-v=hoc],#app[data-v=luyen],#app[data-v=toi]{column-count:2;column-gap:18px}
  #app[data-v] .card,#app[data-v] .grid3,#app[data-v] .badges,#app[data-v] .btn{break-inside:avoid}
  #app[data-v=hoc] .card,#app[data-v=luyen] .card,#app[data-v=toi] .card{margin:0 0 18px}
  #app .chips,#app .warn,#app .foot,#app .thang,#app .luyenhero,#app .lvcard,#app[data-v=toi] .grid3{column-span:all}
  #app .chips,#app .warn{margin-bottom:16px}
  #app .thang,#app .luyenhero,#app .lvcard,#app[data-v=toi] .grid3{margin-bottom:18px}
  .thang .kchips{grid-template-columns:repeat(2,1fr)}
  .thang .ring,.lvcard .ring{width:132px;height:132px}
  .thang .ring svg,.lvcard .ring svg{width:132px;height:132px}
  .sec{margin-top:4px}
  #app[data-v=de],#app[data-v=hang]{max-width:780px}
  #app[data-v=dn]{max-width:480px}
  .toast{bottom:28px}
}
.dn-goiy{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}.dn-goiy button{text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--primary-soft);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}.dn-goiy button:hover{border-color:var(--primary)}select.inp{appearance:auto;color:var(--ink)}select.inp option{background:var(--card);color:var(--ink)}

/* mod_chuoi.css */
.ch-card{padding:14px}
.ch-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ch-t{font-weight:700;font-size:15px}
.ch-t b{color:var(--gold);font-size:20px}
.ch-the{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--sky-soft);color:var(--sky);font-size:12px;font-weight:700;white-space:nowrap}
.ch-the.het{background:var(--card2);color:var(--muted)}
.ch-wrap{display:flex;gap:6px;align-items:stretch}
.ch-thu{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--muted);line-height:1;text-align:right;min-width:18px}
.ch-thu span{display:flex;align-items:center;justify-content:flex-end}
.ch-grid{flex:1;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:none;grid-auto-flow:row;gap:3px;min-width:0}
.ch-c{aspect-ratio:1;border:0;padding:0;margin:0;border-radius:4px;background:var(--card2);color:var(--ink);font-size:9px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;min-width:0}
.ch-c.l1{background:var(--primary-soft)}
.ch-c.l2{background:var(--primary-soft);background:color-mix(in srgb,var(--primary) 38%,var(--card2))}
.ch-c.l3{background:var(--primary-soft);background:color-mix(in srgb,var(--primary) 68%,var(--card2))}
.ch-c.l4{background:var(--primary)}
.ch-c.dongbang{background:var(--sky-soft);box-shadow:inset 0 0 0 1px var(--sky)}
.ch-c.nay{box-shadow:0 0 0 2px var(--gold)}
.ch-c.tuong{visibility:hidden;pointer-events:none}
.ch-c.chon{outline:2px solid var(--ink);outline-offset:1px;z-index:1}
.ch-c:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.ch-leg{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:8px;font-size:10px;color:var(--muted)}
.ch-leg i{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--card2)}
.ch-leg i.l1{background:var(--primary-soft)}
.ch-leg i.l2{background:var(--primary-soft);background:color-mix(in srgb,var(--primary) 38%,var(--card2))}
.ch-leg i.l3{background:var(--primary-soft);background:color-mix(in srgb,var(--primary) 68%,var(--card2))}
.ch-leg i.l4{background:var(--primary)}
.ch-info{margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--card2);font-size:13px;color:var(--muted);min-height:20px}
.ch-info b{color:var(--ink)}
.ch-nhe{opacity:.7}
@media (min-width:900px){.ch-card{padding:18px}.ch-c{border-radius:5px;font-size:11px}.ch-grid{gap:4px}.ch-thu{gap:4px}}
@media (prefers-reduced-motion:no-preference){.ch-c{transition:transform .12s}.ch-c:hover{transform:scale(1.12)}}
/* mod_hieuung.css */
.fx-cv{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
#slot-brand{display:inline-flex;gap:8px;align-items:center}
.fx-snd{margin-right:6px}
.fx-hh{font-size:96px;line-height:1.1;animation:fxpop .7s cubic-bezier(.2,1.6,.4,1) both}
.fx-nhan{letter-spacing:2px;font-weight:800;font-size:12px;margin-top:14px}
.fx-thoai{color:#C9D8CE;margin:6px auto 0;max-width:300px}
.fx-b{border:0;font:inherit;color:inherit}
button.fx-b{cursor:pointer}
.fx-an .badge .ic{font-size:30px}
.fx-goi{margin:8px 2px 0}
:root[data-theme=light] .fx-thoai{color:#C9D8CE}
@keyframes fxpop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  .fx-hh{animation:none}
  .fx-cv{display:none}
}

/* ===== Mô-đun C: Bản đồ nhiệt + giữ chuỗi (ô slot-toi-giua) ===== */
var CH = { dangGiu: false, daThu: '', chon: '' };

function chNgay_(s, n) {
  var p = String(s).split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10);
}
function chThu_(s) {
  var p = String(s).split('-');
  return (new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay() + 6) % 7;
}
function chHienNgay_(s) {
  var p = String(s).split('-'), ten = ['Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ nhật'];
  return ten[chThu_(s)] + ', ' + p[2] + '/' + p[1];
}
function chMuc_(o) {
  if (!o || !o.de) return 0;
  if (o.dung <= 0) return 1;
  if (o.dung < 6) return 2;
  if (o.dung < 16) return 3;
  return 4;
}
function chHomNay_(m) {
  if (m && m.homNay) return m.homNay;
  var t = new Date();
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate());
}

function chThongTin_(ng, m, hn) {
  if (ng > hn) return '';
  var o = m && m.ngay && m.ngay[ng], db = m && m.dongBang && m.dongBang.indexOf(ng) >= 0;
  var h = '<b>' + chHienNgay_(ng) + '</b>: ';
  if (o && o.de) h += o.de + ' đề, <b>' + o.dung + '</b> câu đúng';
  else if (db) h += '❄️ thẻ đóng băng đã giữ chuỗi cho em';
  else h += 'chưa luyện đề';
  return h;
}

function chVe_() {
  var el = $('slot-toi-giua');

  var m = S.data.mod && S.data.mod.Chuoi;
  if (m && m.loi) m = null;
  var hn = chHomNay_(m), bd = chNgay_(hn, -chThu_(hn) - 77);
  var chuoi = m ? m.chuoi : (S.data.exp ? S.data.exp.chuoi : 0) || 0;
  var the = m ? m.theConTuan : null;
  var h = '<div class="card ch-card"><div class="ch-head"><div class="ch-t">🔥 Chuỗi <b>' + chuoi + '</b> ngày liên tiếp</div>';
  if (the != null) h += '<span class="ch-the' + (the > 0 ? '' : ' het') + '">❄️ ' + (the > 0 ? 'Còn ' + the + ' thẻ tuần này' : 'Hết thẻ tuần này') + '</span>';

  var r, k, ng, o, c;

    for (k = 0; k < 12; k++) {
      ng = chNgay_(bd, k * 7 + r);
      if (ng > hn) { h += '<span class="ch-c tuong"></span>'; continue; }
      o = m && m.ngay && m.ngay[ng];
      var db = m && m.dongBang && m.dongBang.indexOf(ng) >= 0;
      c = 'ch-c l' + chMuc_(o) + (db ? ' dongbang' : '') + (ng === hn ? ' nay' : '') + (ng === CH.chon ? ' chon' : '');
      h += '<button type="button" class="' + c + '" data-ng="' + ng + '" aria-label="' + esc(chHienNgay_(ng)) + '">' + (db ? '❄️' : '') + '</button>';
    }

  h += '</div></div><div class="ch-leg">Ít <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> Nhiều<span class="ch-nhe"> · ❄️ ngày giữ chuỗi</span></div>';
  h += '<div class="ch-info" id="ch-info">' + (CH.chon ? chThongTin_(CH.chon, m, hn) : (m ? 'Bấm vào một ô để xem số đề và số câu đúng.' : 'Chưa có dữ liệu bản đồ nhiệt.')) + '</div></div>';
  el.innerHTML = h;
  var g = $('ch-grid');
  if (g) g.onclick = function (e) {
    var b = e.target;

function chCuuChuoi_(d) {

/* ===== Mô-đun B: hiệu ứng (pháo hoa, âm thanh) và huy hiệu ẩn ===== */
var FX = { on: true, ac: null, cv: null, raf: 0, hang: [], ban: false };

CAU_KIEU.GHEP = {

    function ghiLai() {

      });
      h += '</div><div class="de-ghcol">';
      phai.forEach(function (t, j) {
        var a = viTriTrai(j), n = a >= 0;
        h += '<button type="button" data-p="' + j + '" class="de-gi ' + (n ? mdMau(a) + ' nối' : '') + (sel && sel.s === 'p' && sel.i === j ? ' sel' : '') + '">' +

  hien: function (cau, gt) {

CAU_KIEU.SAPXEP = {

    var buoc = cau.luaChon || [], n = buoc.length, ord = [], k = cau.k || '', i;
    var x = mdTachK(tl);

    function ve() {
      var h = '<div class="de-sx"><div class="de-ghhd">Sắp xếp từ trên xuống dưới. Bấm ▲ ▼ hoặc giữ ☰ rồi kéo.</div><ol class="de-sl">';

        h += '<li class="de-si" data-d="' + d + '"><i class="de-sn">' + (p + 1) + '</i><span class="de-st">' + esc(buoc[d]) + '</span>' +
          '<button type="button" class="de-mv" data-up="' + p + '" aria-label="Lên"' + (p ? '' : ' disabled') + '>▲</button>' +
          '<button type="button" class="de-mv" data-dn="' + p + '" aria-label="Xuống"' + (p < n - 1 ? '' : ' disabled') + '>▼</button>' +

      Array.prototype.forEach.call(el.querySelectorAll('[data-dn]'), function (b) { b.onclick = function () { doi(Number(b.dataset.dn), 1); }; });
      Array.prototype.forEach.call(el.querySelectorAll('.de-kz'), function (z) { z.onpointerdown = function (ev) { keo(ev, z.parentNode); }; });
    }
    function doi(p, h) {
      var t = ord[p]; ord[p] = ord[p + h]; ord[p + h] = t;
      ghiLai(); ve();
    }
    function keo(ev, li) {
      if (ev.button > 0) return;
      ev.preventDefault();
      var ol = li.parentNode;
      li.classList.add('keo');
      try { ev.target.setPointerCapture(ev.pointerId); } catch (e) { }
      function di(e2) {
        var y = e2.clientY, r, dem = 0, moi = true;
        while (moi && dem++ < 12) {
          var ds2 = Array.prototype.slice.call(ol.children), vt = ds2.indexOf(li), truoc = ds2[vt - 1], sau = ds2[vt + 1];
          moi = false;
          if (truoc) { r = truoc.getBoundingClientRect(); if (y < r.top + r.height / 2) { ol.insertBefore(li, truoc); moi = true; } }
          if (!moi && sau) { r = sau.getBoundingClientRect(); if (y > r.top + r.height / 2) { ol.insertBefore(sau, li); moi = true; } }
        }
      }
      function xong() {
        document.removeEventListener('pointermove', di); document.removeEventListener('pointerup', xong); document.removeEventListener('pointercancel', xong);
        ord = Array.prototype.map.call(ol.children, function (c) { return Number(c.dataset.d); });
        ghiLai(); ve();
      }
      document.addEventListener('pointermove', di);
      document.addEventListener('pointerup', xong);
      document.addEventListener('pointercancel', xong);
    }
    ve();
  },
  hien: function (cau, gt) {
    var buoc = cau.luaChon || [], x = mdTachK(gt), h = '', d;

      var ds = x.nd.split(',').map(Number), dung = cau._dapAn || null;

      });
      return h;
    }
    d = mdJson(gt);
    if (mdMangPhu(d)) {
      cau._dapAn = d;
      d.forEach(function (t, p) { h += '<span class="de-hk">' + (p + 1) + '. ' + esc(t) + '</span>'; });
      return h;
    }
    return esc(gt);
  }
};

function mdChepChu(chu, xong) {

    var t = document.createElement('textarea');
    t.value = chu; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(t);
    xong(ok);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(chu).then(function () { xong(true); }, du);
  else du();
}

  function tai() {

          '<button type="button" class="btn ghost de-nho" data-ma="' + esc(c.maCau) + '" data-bat="' + (c.bat ? '0' : '1') + '">' + (c.bat ? 'Tắt' : 'Bật lại') + '</button></div>';
      }).join('') : 'Chưa có câu nào.';
      Array.prototype.forEach.call(g.querySelectorAll('[data-ma]'), function (b) {

          call('gvDeTat', [mdToken(), b.dataset.ma, b.dataset.bat === '1']).then(function () { tai(); }).catch(function (e) { b.disabled = false; toast('⚠️ ' + mdLoi(e)); });
        };
      });
    }).catch(function (e) { var g = $('deGan'); if (g) g.textContent = '⚠️ ' + mdLoi(e); });
  }
  $('deTai').onclick = tai;
  tai();
}

function mdDangKy() {

mdDangKy();

/* ===== Mô-đun C (v0.7): Trang giáo viên (cộng/trừ điểm lớp, Zoom, lịch sử) ===== */
window.GV = window.GV || {};
GV.man = GV.man || [];
var GVS = { tk: '', ten: '', lops: [], lop: '', ky: 'tuan', tab: 'lop', du: null, chon: {}, nhieu: false, tm: 0, zoom: null, ls: null, toastTm: 0 };

function gvGoi_(fn, args) {
  return call(fn, [GVS.tk].concat(args || [])).then(function (r) { return r; }, function (e) {
    var m = (e && e.message) ? e.message : String(e || '');
    if (m.indexOf('hết hạn') >= 0) { toast('Phiên giáo viên đã hết hạn, đăng nhập lại.'); setTimeout(function () { gvThoat_(); }, 900); }
    throw e;
  });
}
function gvLoi_(e) { toast((e && e.message) ? e.message : String(e || 'Có lỗi, thử lại.')); }
function gvThoat_() {
  luu('gvToken', null); luu('gvTen', null); luu('gvLop', null); luu('gvLopChon', null);
  location.reload();
}

/* ---------- Nút ở màn đăng nhập học sinh + màn đăng nhập giáo viên ---------- */
onHook('sau_ve', function (t) {
  if (t !== 'dn') return;

  var b = document.createElement('button');
  b.className = 'gv-vao'; b.type = 'button'; b.textContent = '👩‍🏫 Giáo viên đăng nhập';
  b.onclick = function () { gvVeDangNhap_(''); };

});

function gvVeDangNhap_(loi) {
  $('nav').classList.add('hide'); $('who').classList.add('hide');
  $('app').dataset.v = 'dn';
  $('app').innerHTML = '<div class="card dn"><div class="dnhero"><span>👩‍🏫</span><span>🐾</span><span>⭐</span></div>' +
    '<h2>Giáo viên đăng nhập</h2><p class="muted small" style="margin:0 0 16px">Nhập tên và mật khẩu giáo viên.</p>' +
    '<input id="gTen" class="inp" placeholder="Tên giáo viên" autocomplete="username" style="margin-bottom:10px">' +
    '<input id="gMk" class="inp" type="password" placeholder="Mật khẩu" autocomplete="current-password" style="margin-bottom:14px">' +
    (loi ? '<div class="warn">' + esc(loi) + '</div>' : '') +
    '<button class="btn" id="gDn">Đăng nhập</button>' +
    '<button class="gv-vao" id="gVe" type="button">← Về trang học sinh</button></div>';
  $('gTen').value = doc('gvTen') || '';
  $('gVe').onclick = function () { veDangNhap(); };
  var xong = function () {
    var t = $('gTen').value.replace(/^\s+|\s+$/g, ''), m = $('gMk').value;
    if (!t || !m) { toast('Nhập đủ tên và mật khẩu.'); return; }
    var b = $('gDn'); b.disabled = true; b.textContent = 'Đang kiểm tra…';
    call('gvDangNhap', [t, m]).then(function (r) {
      luu('gvToken', r.token); luu('gvTen', r.ten || t); luu('gvLop', r.lop || []); luu('gvLopChon', null);
      GV.batDau();
    }, function (e) {
      gvVeDangNhap_((e && e.message) ? e.message : 'Đăng nhập chưa được.');
    });
  };
  $('gDn').onclick = xong;
  $('gMk').onkeydown = function (ev) { if (ev.keyCode === 13) xong(); };
}

/* ---------- Khung giáo viên ---------- */
GV.batDau = function () {
  var tk = doc('gvToken'); if (!tk) return false;
  GVS.tk = tk; GVS.ten = doc('gvTen') || ''; GVS.lop = doc('gvLopChon') || '';
  GVS.lops = (doc('gvLop') || []).filter(function (x) { return x && x !== '*'; });
  if (GVS.lops.indexOf(GVS.lop) < 0) GVS.lop = GVS.lops[0] || '';
  GVS.chon = {}; GVS.nhieu = false; GVS.du = null; GVS.zoom = null; GVS.ls = null;
  $('who').classList.add('hide');
  $('nav').classList.remove('hide');
  gvVeNav_();
  gvVao_('lop');
  return true;
};

function gvVeNav_() {
  var h = '<button data-gv="lop"><b>🐾</b>Lớp</button><button data-gv="zoom"><b>💬</b>Zoom</button><button data-gv="ls"><b>🕘</b>Lịch sử</button>';
  if (GV.man.length > 2) h += '<button data-gv="them"><b>➕</b>Thêm</button>';
  else GV.man.forEach(function (m) { h += '<button data-gv="man:' + esc(m.id) + '"><b>' + esc(m.icon) + '</b>' + esc(m.ten) + '</button>'; });
  h += '<button data-gv="thoat"><b>🚪</b>Thoát</button>';
  $('nav').innerHTML = '<div>' + h + '</div>';
  Array.prototype.forEach.call($('nav').querySelectorAll('button'), function (b) {
    b.onclick = function () {
      if (b.dataset.gv === 'thoat') { if (confirm('Thoát trang giáo viên?')) gvThoat_(); return; }
      gvVao_(b.dataset.gv);
    };
  });
}

function gvVao_(tab) {
  if (GVS.tm) { clearInterval(GVS.tm); GVS.tm = 0; }
  GVS.tab = tab;
  Array.prototype.forEach.call($('nav').querySelectorAll('button'), function (b) {
    b.classList.toggle('on', b.dataset.gv === tab || (tab.indexOf('man:') === 0 && b.dataset.gv === 'them'));
  });
  $('app').dataset.v = 'gv';
  if (tab === 'lop') gvVeLop_();
  else if (tab === 'zoom') gvVeZoom_();
  else if (tab === 'ls') gvVeLichSu_();
  else if (tab === 'them') gvVeThem_();
  else if (tab.indexOf('man:') === 0) gvVeMan_(tab.slice(4));
  window.scrollTo(0, 0);
}

function gvChonLop_(id) {
  if (GVS.lops.length < 2) return '<span class="gv-lopten">🏫 ' + esc(GVS.lop || 'Chưa có lớp') + '</span>';
  return '<select class="gv-sel" id="' + id + '">' + GVS.lops.map(function (l) {
    return '<option value="' + esc(l) + '"' + (l === GVS.lop ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('') + '</select>';
}
function gvGanLop_(id, xong) {
  var s = $(id); if (!s) return;
  s.onchange = function () { GVS.lop = s.value; luu('gvLopChon', GVS.lop); GVS.du = null; GVS.chon = {}; GVS.zoom = null; GVS.ls = null; xong(); };
}
function gvTop_(tieu, idSel) {
  return '<div class="gv-top"><div class="gv-ten"><small>👩‍🏫 ' + esc(GVS.ten) + '</small><h2>' + tieu + '</h2></div><div>' + gvChonLop_(idSel) + '</div></div>';
}

/* ---------- Màn Lớp ---------- */
function gvLvSvg_(it) {
  try {
    if (it.linhVat && window.LVH && LVH.evo && window.lvMuc) return LVH.evo(it.linhVat, 'base', lvMuc(it.cap));
  } catch (e) { }
  return '<span class="gv-egg">🥚</span>';
}

function gvVeLop_() {
  var h = gvTop_('Điểm lớp', 'gvSelL') +
    '<div class="seg" id="gvKy"><button data-k="tuan">Tuần</button><button data-k="thang">Tháng</button><button data-k="tong">Tổng</button></div>' +
    '<div class="gv-bar" id="gvBar"></div><div id="gvLuoi" class="gv-luoi"><div class="spin">Đang tải lớp…</div></div>';
  $('app').innerHTML = h;
  gvGanLop_('gvSelL', gvVeLop_);
  Array.prototype.forEach.call($('gvKy').querySelectorAll('button'), function (b) {
    b.classList.toggle('on', b.dataset.k === GVS.ky);
    b.onclick = function () { GVS.ky = b.dataset.k; GVS.du = null; gvVeLop_(); };
  });
  $('gvLuoi').onclick = gvBamLuoi_;
  gvTaiLop_(false);
  GVS.tm = setInterval(function () {
    if (document.hidden || GVS.tab !== 'lop' || $('gvBang')) return;
    gvTaiLop_(true);
  }, 30000);
}

function gvTaiLop_(nen) {
  if (!GVS.lop) { $('gvLuoi').innerHTML = '<div class="warn">Tài khoản này chưa có lớp nào.</div>'; return; }
  var lop = GVS.lop, ky = GVS.ky;
  gvGoi_('gvLop', [lop, ky]).then(function (r) {
    if (GVS.tab !== 'lop' || lop !== GVS.lop || ky !== GVS.ky) return;
    GVS.du = r;
    var alive = {}; (r.ds || []).forEach(function (x) { alive[x.ma] = 1; });
    Object.keys(GVS.chon).forEach(function (m) { if (!alive[m]) delete GVS.chon[m]; });
    gvVeLuoi_();
  }, function (e) { if (!nen) { $('gvLuoi').innerHTML = '<div class="warn">' + esc((e && e.message) || 'Không tải được lớp.') + '</div>'; } });
}

function gvSoChon_() { return Object.keys(GVS.chon).length; }

function gvVeLuoi_() {
  var d = GVS.du; if (!d || !$('gvLuoi')) return;
  var ds = d.ds || [];
  var bar = '<button class="gv-nut' + (GVS.nhieu ? ' on' : '') + '" id="gvNhieu">' + (GVS.nhieu ? '✅ Đang chọn nhiều' : '☑️ Chọn nhiều') + '</button>';
  if (GVS.nhieu) {
    bar += '<span class="gv-dem">Đã chọn <b>' + gvSoChon_() + '</b></span>' +
      '<button class="gv-nut" id="gvHet">Chọn hết</button><button class="gv-nut" id="gvBo">Bỏ chọn</button>' +
      '<button class="gv-nut gv-chinh" id="gvCongN"' + (gvSoChon_() ? '' : ' disabled') + '>➕ Cộng điểm</button>';
  }
  $('gvBar').innerHTML = bar;
  $('gvNhieu').onclick = function () { GVS.nhieu = !GVS.nhieu; GVS.chon = {}; gvVeLuoi_(); };
  if (GVS.nhieu) {
    $('gvHet').onclick = function () { ds.forEach(function (x) { GVS.chon[x.ma] = 1; }); gvVeLuoi_(); };
    $('gvBo').onclick = function () { GVS.chon = {}; gvVeLuoi_(); };
    $('gvCongN').onclick = function () {
      var l = Object.keys(GVS.chon); if (!l.length) return;
      gvMoBang_(l, l.length + ' em đã chọn');
    };
  }
  var h = '<button class="gv-o gv-lop" data-ma="*LOP*"><span class="gv-lv">🏫</span><b>Cả lớp</b><span class="gv-bd' + (d.tongLop < 0 ? ' neg' : '') + '">' + (d.tongLop == null ? ds.length : d.tongLop) + '</span></button>';
  ds.forEach(function (x) {
    var d0 = Number(x.diem) || 0, sz = 54 + Math.min(Number(x.cap) || 0, 8) * 5;
    h += '<button class="gv-o' + (GVS.chon[x.ma] ? ' chon' : '') + '" data-ma="' + esc(x.ma) + '">' +
      '<span class="gv-lv" style="width:' + sz + '%">' + gvLvSvg_(x) + '</span>' +
      '<b>' + esc(x.ten) + '</b><span class="gv-bd' + (d0 < 0 ? ' neg' : '') + '">' + (d0 > 0 ? '+' : (d0 < 0 ? '−' : '')) + Math.abs(d0) + '</span>' +
      (GVS.chon[x.ma] ? '<i class="gv-tick">✓</i>' : '') + '</button>';
  });
  if (!ds.length) h += '<div class="warn" style="grid-column:1/-1">Lớp chưa có học sinh.</div>';
  $('gvLuoi').innerHTML = h;
}

function gvTenEm_(ma) {
  var l = (GVS.du && GVS.du.ds) || [];
  for (var i = 0; i < l.length; i++) if (l[i].ma === ma) return l[i].ten;
  return ma;
}

function gvBamLuoi_(ev) {
  var t = ev.target; while (t && t !== this && !(t.dataset && t.dataset.ma)) t = t.parentNode;
  if (!t || t === this) return;
  var ma = t.dataset.ma;
  if (ma === '*LOP*') { gvMoBang_(['*LOP*'], 'Cả lớp (' + ((GVS.du && GVS.du.ds && GVS.du.ds.length) || 0) + ' em)'); return; }
  if (GVS.nhieu) {
    if (GVS.chon[ma]) delete GVS.chon[ma]; else GVS.chon[ma] = 1;
    gvVeLuoi_(); return;
  }
  gvMoBang_([ma], gvTenEm_(ma));
}

/* ---------- Bảng cộng/trừ ---------- */
function gvMoBang_(dsMa, tieu) {
  var d = GVS.du || {}, loai = d.loai || [];
  var cong = loai.filter(function (l) { return Number(l.diem) >= 0; }), tru = loai.filter(function (l) { return Number(l.diem) < 0; });
  var nut = function (l) {
    var dg = Number(l.diem);
    return '<button class="gv-l' + (dg < 0 ? ' tru' : '') + '" data-ma="' + esc(l.ma) + '"><span>' + esc(l.icon) + '</span><b>' + esc(l.ten) + '</b><em>' + (dg > 0 ? '+' : '−') + Math.abs(dg) + '</em></button>';
  };
  var o = document.createElement('div'); o.className = 'gv-bk'; o.id = 'gvBang';
  o.innerHTML = '<div class="gv-sh"><div class="gv-sh-top"><h3>' + esc(tieu) + '</h3><button class="gv-x" id="gvX" aria-label="Đóng">✕</button></div>' +
    '<div class="gv-2c"><div><div class="gv-ct cong">➕ Cộng</div>' + cong.map(nut).join('') + '</div>' +
    '<div><div class="gv-ct tru">➖ Trừ</div>' + tru.map(nut).join('') + '</div></div>' +
    '<input class="inp" id="gvGc" placeholder="Ghi chú (không bắt buộc)" maxlength="80">' +
    '<div class="gv-tuy"><input class="inp" id="gvSo" type="number" min="1" max="20" value="1" inputmode="numeric"><button class="gv-nut gv-chinh" id="gvTC">➕ Cộng</button><button class="gv-nut gv-do" id="gvTT">➖ Trừ</button></div></div>';
  document.body.appendChild(o);
  var dong = function () { if (o.parentNode) o.parentNode.removeChild(o); };
  o.onclick = function (ev) { if (ev.target === o) dong(); };
  $('gvX').onclick = dong;
  Array.prototype.forEach.call(o.querySelectorAll('.gv-l'), function (b) {
    b.onclick = function () {
      var l = null; loai.forEach(function (x) { if (x.ma === b.dataset.ma) l = x; });
      if (!l) return;
      var gc = o.querySelector('#gvGc').value; dong(); gvLamCong_(dsMa, l.ma, Number(l.diem), '', l.icon, l.ten, gc);
    };
  });
  var tuy = function (dau) {
    var n = Math.round(Number($('gvSo').value));
    if (!n || n < 1 || n > 50) { toast('Nhập số điểm từ 1 đến 50.'); return; }
    var gc = $('gvGc').value; dong();
    gvLamCong_(dsMa, '', dau * n, '', dau > 0 ? '➕' : '➖', gc || 'Điểm tuỳ ý', gc);
  };
  $('gvTC').onclick = function () { tuy(1); };
  $('gvTT').onclick = function () { tuy(-1); };
}

function gvApDung_(dsMa, diem, dau) {
  var d = GVS.du; if (!d) return;
  var ca = dsMa.length === 1 && dsMa[0] === '*LOP*', n = 0, set = {};
  dsMa.forEach(function (m) { set[m] = 1; });
  (d.ds || []).forEach(function (x) { if (ca || set[x.ma]) { x.diem = (Number(x.diem) || 0) + diem * dau; n++; } });
  if (d.tongLop != null) d.tongLop = (Number(d.tongLop) || 0) + diem * dau * n;
}

function gvLamCong_(dsMa, maLoai, diem, x, icon, ten, ghiChu) {
  var lop = GVS.lop, ky = GVS.ky;
  gvApDung_(dsMa, diem, 1); gvVeLuoi_();
  var ai = (dsMa.length === 1 && dsMa[0] === '*LOP*') ? 'cả lớp' : (dsMa.length === 1 ? gvTenEm_(dsMa[0]) : dsMa.length + ' em');
  gvGoi_('gvCong', [lop, dsMa, maLoai, diem, ghiChu || '']).then(function (r) {
    gvToastHoan_('✅ ' + (diem > 0 ? '+' : '−') + Math.abs(diem) + ' ' + ten + ' cho ' + ai, function () {
      gvGoi_('gvHoanTac', [r.maLan]).then(function () {
        gvApDung_(dsMa, diem, -1); gvVeLuoi_(); toast('↩️ Đã hoàn tác');
        gvTaiLop_(true);
      }, gvLoi_);
    });
    GVS.chon = {}; if (GVS.nhieu) GVS.nhieu = false;
    gvTaiLop_(true);
  }, function (e) { gvApDung_(dsMa, diem, -1); gvVeLuoi_(); gvLoi_(e); });
}

function gvToastHoan_(msg, hoan) {
  var c = $('gvToast'); if (c) c.parentNode.removeChild(c);
  if (GVS.toastTm) clearTimeout(GVS.toastTm);
  var t = document.createElement('div'); t.className = 'gv-toast'; t.id = 'gvToast';
  t.innerHTML = '<span>' + esc(msg) + '</span><button type="button">↩️ Hoàn tác</button>';
  document.body.appendChild(t);
  var go = function () { if (t.parentNode) t.parentNode.removeChild(t); };
  t.querySelector('button').onclick = function () { go(); hoan(); };
  GVS.toastTm = setTimeout(go, 10000);
}

/* ---------- Màn Zoom ---------- */
function gvVeZoom_() {
  var z = GVS.zoom;
  var h = gvTop_('Điểm từ chat Zoom', 'gvSelZ') +
    '<div class="card"><p class="muted small" style="margin:0 0 10px">Chọn file chat Zoom (.txt) hoặc dán nội dung vào ô dưới.</p>' +
    '<label class="gv-nut gv-file">📂 Chọn file .txt<input type="file" id="gvFile" accept=".txt" class="hide"></label>' +
    '<textarea id="gvTxt" class="inp gv-ta" placeholder="Hoặc dán nội dung chat Zoom vào đây…"></textarea>' +
    '<button class="btn" id="gvDoc" style="margin-top:10px">Đọc file</button></div><div id="gvKq"></div>';
  $('app').innerHTML = h;
  gvGanLop_('gvSelZ', gvVeZoom_);
  if (z) { $('gvTxt').value = z.nd; if (z.r && z.lop === GVS.lop) gvVeBangZoom_(); }
